version: '3.8'

services:
  slimbox:
    image: slimbox:latest
    build:
      context: .
      dockerfile: Dockerfile
    container_name: slimbox
    restart: unless-stopped
    ports:
      - "8083:8080"
    volumes:
      # 持久化数据目录 (ADR-0001)
      - /opt/docker/slimbox/data:/data
    environment:
      - TZ=Asia/Shanghai
      - PORT=8080
      - SLIMBOX_DATA_DIR=/data
      # 可选: 若需要内网密码或外网访问防护，取消以下注释并设置密码 (ADR-0009)
      # - SLIMBOX_API_KEY=your_secure_password
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
